name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests (no release artifacts)
        run: |
          for test_file in tests/test_*.py; do
            if [ "$test_file" = "tests/test_release.py" ]; then continue; fi
            pytest -q "$test_file" -m "not slow and not release" || exit 1
          done
      - name: Installed wheel outside checkout
        run: |
          pip wheel . --no-deps -w /tmp/geouno-wheel
          pip install --no-deps --target /tmp/geouno-installed /tmp/geouno-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/geouno-installed python -m geouno.cli paper-numbers
          PYTHONPATH=/tmp/geouno-installed python -c "from geouno.tasks import reference_scores; assert reference_scores()"
